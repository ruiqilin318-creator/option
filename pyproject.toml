[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "option-report"
version = "0.1.0"
description = "ETF option auto data fetcher and PDF report generator"
requires-python = ">=3.10"
dependencies = [
  "akshare>=1.14.0",
  "pandas>=2.0.0",
  "jinja2>=3.1.0",
  "reportlab>=4.0.0",
  "apscheduler>=3.10.0",
  "pytz>=2024.1",
]

[project.scripts]
option-report = "option_report.cli:main"

[tool.setuptools.packages.find]
include = ["option_report*"]
